<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e13">
<title>Sem conexão · Odonto Hub</title>
<style>
  :root { color-scheme: dark light; }
  html, body { margin: 0; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
    background: #0a0e13; color: #f2efe9; font-family: -apple-system, "SF Pro Text", system-ui, sans-serif; text-align: center; -webkit-font-smoothing: antialiased; }
  @media (prefers-color-scheme: light) { body { background: #f5f3ee; color: #15191e; } p { color: #48515b !important; } }
  img { width: 88px; height: 88px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  h1 { font-size: 22px; margin: 22px 0 8px; }
  p { margin: 0 auto; max-width: 300px; color: #a8b0b9; line-height: 1.5; font-size: 15px; }
  button { margin-top: 26px; border: 0; border-radius: 12px; background: #e8b54b; color: #0a0e13; font-weight: 700; font-size: 15px; padding: 13px 26px; }
</style>
</head>
<body>
  <main>
    <img src="/pwa/apple-touch-icon.png" alt="">
    <h1>Sem conexão com a internet</h1>
    <p>Por segurança, os dados dos pacientes não ficam salvos no aparelho. Assim que a internet voltar, é só tentar de novo.</p>
    <button onclick="location.reload()">Tentar de novo</button>
  </main>
</body>
</html>
